<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>清除 AI 学习案例残留数据</title>
<style>
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; max-width: 680px; margin: 48px auto; padding: 0 16px; color: #1f2329; }
  h1 { font-size: 19px; margin-bottom: 8px; }
  p { color: #5e6573; line-height: 1.6; }
  code { background: #eef1f5; padding: 1px 6px; border-radius: 4px; }
  button { padding: 11px 18px; font-size: 14px; cursor: pointer; border: 0; border-radius: 8px; background: #2f6fed; color: #fff; }
  button:active { background: #2559c9; }
  pre { background: #f6f8fa; padding: 14px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; min-height: 70px; margin-top: 14px; font-size: 13px; line-height: 1.6; }
  .tip { font-size: 12px; color: #95a0ad; margin-top: 18px; }
</style>
</head>
<body>
<h1>清除 AI 学习中心残留数据</h1>
<p>此工具仅删除浏览器中遗留的「AI 学习中心」案例（IndexedDB 与 localStorage 中的 <code>netops_learn_cases</code>），<b>不会影响</b>基线、采集草稿、快照等其他数据。</p>
<button id="btn">一键清除</button>
<pre id="log">点击上方按钮开始…</pre>
<p class="tip">清除后请回到应用按 <code>Ctrl+F5</code> 强刷页面。若之后不再打开本页，可直接删除此文件。</p>

<script>
const KEY = 'netops_learn_cases'
const DB_NAME = 'netops-db'
const STORE = 'kv'

function log(msg) {
  document.getElementById('log').textContent += '\n' + msg
}

async function clear() {
  document.getElementById('log').textContent = ''
  let ok = true

  // 1. IndexedDB（主存储）
  try {
    await new Promise((resolve) => {
      const req = indexedDB.open(DB_NAME, 1)
      req.onsuccess = () => {
        const db = req.result
        if (!db.objectStoreNames.contains(STORE)) {
          log('IndexedDB 无 kv store，跳过')
          return resolve()
        }
        const tx = db.transaction(STORE, 'readwrite')
        const store = tx.objectStore(STORE)
        const getReq = store.get(KEY)
        getReq.onsuccess = () => {
          if (getReq.result === undefined) {
            log('IndexedDB 中未发现学习案例数据')
          } else {
            const n = Array.isArray(getReq.result) ? getReq.result.length : '?'
            store.delete(KEY)
            log('已删除 IndexedDB 中的学习案例（' + n + ' 条）')
          }
        }
        tx.oncomplete = () => resolve()
        tx.onerror = () => { ok = false; log('IndexedDB 删除失败：' + tx.error); resolve() }
      }
      req.onerror = () => { ok = false; log('无法打开 IndexedDB：' + req.error); resolve() }
    })
  } catch (e) {
    ok = false
    log('IndexedDB 异常：' + e.message)
  }

  // 2. localStorage（兜底存储）
  try {
    if (localStorage.getItem(KEY) != null) {
      localStorage.removeItem(KEY)
      log('已删除 localStorage 中的学习案例')
    } else {
      log('localStorage 中未发现学习案例数据')
    }
  } catch (e) {
    ok = false
    log('localStorage 异常：' + e.message)
  }

  log(ok ? '\n✅ 清除完成。请回到应用按 Ctrl+F5 强刷。' : '\n⚠️ 部分清除失败，详见上方信息。')
}

document.getElementById('btn').addEventListener('click', clear)
</script>
</body>
</html>
